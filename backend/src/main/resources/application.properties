spring.application.name=clyra-backend
server.port=${PORT:8080}

# Optional local .env file (KEY=VALUE lines) in the backend/ folder. It is git-ignored.
spring.config.import=optional:file:.env[.properties]

# Path to the Firebase service account JSON (kept OUTSIDE git). If empty, Google
# Application Default Credentials (GOOGLE_APPLICATION_CREDENTIALS) are used.
clyra.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}

# Comma-separated list of frontend origins allowed to call this API.
clyra.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# One-time bootstrap: email of an EXISTING Firebase Auth user to promote to STAFF
# when no STAFF account exists yet. Leave empty afterwards.
clyra.bootstrap.staff-email=${BOOTSTRAP_STAFF_EMAIL:}

# Never leak stack traces to clients.
server.error.include-stacktrace=never
server.error.include-message=never
